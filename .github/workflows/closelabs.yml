name: "CloseLabs Voice — Build"

# Pipeline de CloseLabs Voice. Compila los instaladores en la nube (runners de
# GitHub) para cada arquitectura y los deja descargables como artefactos.
#
# macOS: UN SOLO .dmg universal (Intel + Apple Silicon dentro; macOS escoge al abrir).
#   El médico no sabe qué chip tiene. Detalle y verificaciones en build-macos-universal.yml.
#
# FASE 1 (actual): SIN firma (sign-binaries: false). El .dmg abre con el truco
#   `xattr -cr` en el Mac del tester.
#
# FASE 2 (cuando exista la cuenta Apple Developer): poner los secretos APPLE_*
#   y cambiar sign-binaries a true → los .dmg quedan firmados + notarizados y
#   abren con doble clic, sin advertencias. (Windows se añade igual, aparte.)
#
# SECRETOS: ninguno para compilar. Desde la Fase 1 el instalador NO lleva llaves de
#   proveedor: la app habla con nuestras Edge Functions, que son las que guardan la de
#   Groq. El secreto CLOSELABS_GROQ_API_KEY quedó sin uso y se puede borrar del repo.

on:
  workflow_dispatch: # botón manual "Run workflow" en la pestaña Actions
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    permissions:
      contents: write
    uses: ./.github/workflows/build-macos-universal.yml
    with:
      asset-prefix: "closelabs-voice"
      # FASE 2: cambiar a true cuando estén los secretos APPLE_* de notarización.
      sign-binaries: false
    secrets: inherit

  windows:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 — instalador .exe (NSIS). Sin firma: se abre con
          # "Más info → Ejecutar de todas formas" (SmartScreen). Firma = Fase 2.
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: "closelabs-voice"
      upload-artifacts: true
      # FASE 2: cambiar a true cuando estén los secretos APPLE_* de notarización.
      sign-binaries: false
    secrets: inherit
